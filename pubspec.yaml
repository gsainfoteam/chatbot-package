name: gist_chatbot_flutter
description: "GIST 챗봇 Flutter 위젯 - 앱 하단 오버레이 형태의 챗봇 패키지"
version: 0.1.0
homepage: https://github.com/gsainfoteam/chatbot-package
repository: https://github.com/gsainfoteam/chatbot-package
issue_tracker: https://github.com/gsainfoteam/chatbot-package/issues

topics:
  - chatbot
  - chat
  - ai
  - widget
  - sse

screenshots:
  - description: 챗봇 패널 초기 화면 - 웰컴 메시지와 자주 묻는 질문
    path: screenshots/welcome.png
  - description: 마크다운으로 렌더링되는 스트리밍 답변
    path: screenshots/conversation.png
  - description: 답변 출처 배지와 피드백 버튼
    path: screenshots/sources.png

environment:
  sdk: ^3.8.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  package_info_plus: ^8.0.0
  flutter_svg: ^2.0.10+1
  gpt_markdown: ^1.1.8
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.0

flutter:
  assets:
    - assets/images/logo.svg
    - assets/images/letsur_logo.svg
